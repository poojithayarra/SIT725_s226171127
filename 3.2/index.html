<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A welcoming Deakin Community Service directory with support options and details.">
    <title>Deakin Community Service</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">Support • Connection • Care</p>
                <h1>Deakin Community Service</h1>
                <p class="hero-copy">Explore local support services that help people find care, guidance, and practical assistance in their community.</p>
            </div>
            <div class="hero-badge">Community directory</div>
        </header>

        <section class="form-panel" aria-label="Add a service">
            <h2>Add a Community Service</h2>
            <form id="serviceForm" class="service-form">
                <div class="form-row">
                    <label for="serviceName">Service Name</label>
                    <input id="serviceName" name="serviceName" required minlength="3" />
                </div>
                <div class="form-row">
                    <label for="category">Category</label>
                    <input id="category" name="category" required />
                </div>
                <div class="form-row">
                    <label for="location">Location</label>
                    <input id="location" name="location" required />
                </div>
                <div class="form-row">
                    <label for="contact">Contact</label>
                    <input id="contact" name="contact" required />
                </div>
                <div class="form-row">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" maxlength="500" required></textarea>
                </div>
                <button type="submit">Save Service</button>
            </form>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
        </section>

        <section class="services-grid" id="servicesContainer" aria-label="Featured services"></section>
    </div>

    <div class="modal" id="bookModal" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" id="closeModal" aria-label="Close service details">×</button>
            <div class="modal-icon" id="modalIcon"></div>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <p class="modal-author" id="modalCategory"></p>
                <p class="modal-location" id="modalLocation"></p>
                <p id="modalDescription"></p>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
